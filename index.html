<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière Kids & Toys - 🎁 Koleksi Mainan Kayu Organik & Edukasi</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700;800&family=Outfit:wght@400;600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="font-fredoka text-slate-900" style="background-color: #F0FDF4">

  <!-- Navigation -->
  <header class="w-full pt-4 px-4 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-5 py-3 rounded-2xl bg-white/90 backdrop-blur border border-slate-200 shadow-md flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-xl text-white font-black bg-[#059669]">
          ⚡
        </div>
        <span class="text-xl font-black text-slate-900">Lumière Kids & Toys</span>
      </div>

      <nav class="hidden md:flex items-center gap-6 text-sm font-bold text-slate-700">
        <a href="#modul" class="hover:text-indigo-600 transition-colors">Ciri Utama</a>
        <a href="#testimoni" class="hover:text-indigo-600 transition-colors">Testimoni</a>
        <a href="#faq" class="hover:text-indigo-600 transition-colors">FAQ</a>
      </nav>

      <div class="flex items-center gap-2">
        <button id="sound-btn" class="w-9 h-9 rounded-full bg-slate-100 text-slate-800 flex items-center justify-center text-sm">
          🔊
        </button>
        <a href="#mula" class="px-4 py-2 text-xs md:text-sm text-white font-bold rounded-xl shadow-md bg-[#059669] hover:opacity-90">
          Mula Sekarang
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="max-w-5xl mx-auto px-6 pt-12 pb-16">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
      <div class="md:col-span-7 space-y-6">
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 text-xs font-black text-slate-900 rounded-full border border-slate-200 bg-[#DCFCE7]">
          🎁 Koleksi Mainan Kayu Organik & Edukasi
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-slate-900 leading-tight">
          Mainan Mesra Kanak-Kanak Yang Selamat, Edukatif & Tahan Lama.
        </h1>
        <p class="text-base sm:text-lg text-slate-600 font-medium">
          Dihasilkan daripada kayu mapel lestari dengan pewarna air semulajadi tanpa toksin untuk merangsang kognitif si manja.
        </p>
        <div class="flex flex-wrap items-center gap-3 pt-2">
          <button class="px-6 py-3.5 text-sm sm:text-base text-white font-black rounded-xl shadow-lg bg-[#059669]">
            Beli Koleksi Terhangat 🛍️
          </button>
          <button class="px-5 py-3.5 text-sm sm:text-base font-bold bg-white text-slate-900 rounded-xl border border-slate-200 shadow-sm">
            Katalog Mainan STEAM
          </button>
        </div>
      </div>

      <!-- Hero Visual Graphic -->
      <div class="md:col-span-5 p-6 rounded-3xl bg-white border border-slate-200 shadow-xl">
        <div id="hero-graphic">
          
        <svg viewBox="0 0 400 360" class="w-full h-full max-h-[340px] mx-auto filter drop-shadow-xl animate-float" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="200" cy="310" rx="110" ry="20" fill="#CBD5E1" opacity="0.5"/>
          <!-- Big 3D Parcel Box -->
          <path d="M200 60 L320 125 L200 190 L80 125 Z" fill="#F97316" stroke="#134E4A" stroke-width="6" stroke-linejoin="round"/>
          <path d="M80 125 L200 190 L200 310 L80 245 Z" fill="#059669" stroke="#134E4A" stroke-width="6" stroke-linejoin="round"/>
          <path d="M320 125 L200 190 L200 310 L320 245 Z" fill="#059669" opacity="0.85" stroke="#134E4A" stroke-width="6" stroke-linejoin="round"/>
          <!-- Parcel Tape -->
          <path d="M140 92 L260 157" stroke="#FEF08A" stroke-width="12" stroke-linecap="round"/>
          <!-- Floating Shopping Badges & Toys popping out -->
          <circle cx="200" cy="90" r="30" fill="#10B981" stroke="#134E4A" stroke-width="4"/>
          <text x="187" y="99" font-size="26">🧸</text>
          
          <circle cx="290" cy="70" r="24" fill="#FFFFFF" stroke="#134E4A" stroke-width="4"/>
          <text x="278" y="78" font-size="20">⭐</text>
          
          <rect x="70" y="190" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#134E4A" stroke-width="3" transform="rotate(-12 70 190)"/>
          <text x="82" y="212" font-family="sans-serif" font-size="12" font-weight="900" fill="#EF4444" transform="rotate(-12 70 190)">DISKAUN 30%</text>
        </svg>
        </div>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
